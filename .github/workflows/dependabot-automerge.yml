name: Dependabot auto-merge

# Only touches Dependabot's own "patch-updates" grouped PR (see
# .github/dependabot.yml) — minor-updates and any standalone major bump
# still require a manual merge click, on purpose.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: >
      github.actor == 'dependabot[bot]' &&
      contains(github.event.pull_request.head.ref, 'patch-updates')
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for this PR
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
